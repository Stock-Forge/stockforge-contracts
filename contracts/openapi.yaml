openapi: 3.0.3
info:
  title: StockForge API
  version: 1.0.0
  description: |
    StockForge trading platform public API contract.
    Client-facing endpoints are routed through stockforge-api.
    Version 1.0.0 — Phase 1 foundation (contract only, no implementation yet).
    Version 1.1.0 — Day 8: order lifecycle implemented in stockforge-order-service (subset).
    Roadmap (not yet implemented): security on order endpoints, MARKET/LIMIT order types,
    partial fills, REJECTED status, order history.

servers:
  - url: http://localhost:8080
    description: Local development (stockforge-api)

paths:
  # ---------- AUTH ----------
  /api/auth/register:
    post:
      summary: Create a user account
      operationId: registerUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid payload
        '409':
          description: Email already registered

  /api/auth/login:
    post:
      summary: Authenticate and receive a JWT
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Invalidate the current token
      operationId: logout
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out

  # ---------- MARKET DATA ----------
  /api/marketdata/{symbol}:
    get:
      summary: Latest price and depth for a symbol
      operationId: getMarketData
      tags: [market-data]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Symbol'
      responses:
        '200':
          description: Current market snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSnapshot'
        '404':
          description: Unknown symbol

  # ---------- ORDERS ----------
  /api/orders:
    post:
      summary: Place an order
      operationId: createOrder
      tags: [orders]
      description: |
        Idempotent via clientOrderId: the first call with a given clientOrderId returns
        201; any retry with the same id returns 200 and the SAME order (no duplicate).
        Day 8 implements the lifecycle subset (limit-only, no security yet).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created (status NEW)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Idempotent replay - existing order returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order (validation)

    get:
      summary: List orders
      operationId: listOrders
      tags: [orders]
      responses:
        '200':
          description: Orders (newest first by creation time)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/orders/{id}:
    get:
      summary: Order detail and current status
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /api/orders/{id}/accept:
    post:
      summary: Transition NEW -> ACCEPTED (exchange-facing)
      operationId: acceptOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '409':
          description: Invalid transition (e.g. accept twice)

  /api/orders/{id}/fill:
    post:
      summary: Transition ACCEPTED -> FILLED (simulated fill)
      operationId: fillOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order filled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '409':
          description: Invalid transition (fill from NEW)

  /api/orders/{id}/cancel:
    post:
      summary: Cancel an open order (NEW or ACCEPTED -> CANCELLED)
      operationId: cancelOrder
      tags: [orders]
      description: |
        Roadmap shape: this is likely to become DELETE /api/orders/{id}.
        A FILLED or already-CANCELLED order cannot be cancelled (409).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '409':
          description: Not cancellable (already filled/cancelled)

  /api/orders/history:
    get:
      summary: Completed order history
      operationId: orderHistory
      tags: [orders]
      description: Roadmap - not implemented on Day 8.
      responses:
        '200':
          description: Historical orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  # ---------- PORTFOLIO ----------
  /api/portfolio:
    get:
      summary: Cash and asset balances
      operationId: getPortfolio
      tags: [portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'

  /api/portfolio/positions:
    get:
      summary: Open positions (holdings)
      operationId: getPositions
      tags: [portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'

  /api/portfolio/pl:
    get:
      summary: Realised and unrealised P&L
      operationId: getPnl
      tags: [portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlSummary'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- AUTH ----------
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            example: USER

    # ---------- MARKET DATA ----------
    Symbol:
      type: string
      description: Uppercase ticker, e.g. AAPL, TSLA

    MarketSnapshot:
      type: object
      required: [symbol, bid, ask, last, volume]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        bid:
          type: number
          format: double
        ask:
          type: number
          format: double
        last:
          type: number
          format: double
          description: Last traded price
        volume:
          type: integer
          format: int64

    # ---------- ORDERS ----------
    CreateOrderRequest:
      type: object
      required: [clientOrderId, symbol, side, quantity, price]
      properties:
        clientOrderId:
          type: string
          description: Idempotency key - retrying with the same value returns the SAME order
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/Side'
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: double
          minimum: 0.01
          description: Limit price (Day 8 is limit-only; MARKET arrives with order types)

    Order:
      type: object
      required: [id, clientOrderId, symbol, side, quantity, price, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        clientOrderId:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/Side'
        quantity:
          type: integer
        price:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        filledQuantity:
          type: integer
          description: Roadmap - partial fills not implemented on Day 8
        orderType:
          $ref: '#/components/schemas/OrderType'
          description: Roadmap - MARKET/LIMIT not implemented on Day 8

    Side:
      type: string
      enum: [BUY, SELL]

    OrderType:
      type: string
      enum: [MARKET, LIMIT]

    OrderStatus:
      type: string
      enum: [NEW, ACCEPTED, REJECTED, PARTIALLY_FILLED, FILLED, CANCELLED]
      description: Day 8 implements NEW, ACCEPTED, FILLED, CANCELLED. REJECTED (Day 9 risk) and PARTIALLY_FILLED are roadmap.

    # ---------- PORTFOLIO ----------
    Portfolio:
      type: object
      required: [cash, assetValue, totalValue]
      properties:
        cash:
          type: number
          format: double
        assetValue:
          type: number
          format: double
        totalValue:
          type: number
          format: double

    Position:
      type: object
      required: [symbol, quantity, averagePrice]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        quantity:
          type: integer
        averagePrice:
          type: number
          format: double

    PnlSummary:
      type: object
      required: [realisedPnl, unrealisedPnl]
      properties:
        realisedPnl:
          type: number
          format: double
        unrealisedPnl:
          type: number
          format: double
