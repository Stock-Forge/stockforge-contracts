openapi: 3.0.3
info:
  title: StockForge API
  version: 1.0.0
  description: |
    StockForge trading platform public API contract.
    Client-facing endpoints are routed through stockforge-api.
    Version 1.0.0 — Phase 1 foundation (contract only, no implementation yet).

servers:
  - url: http://localhost:8080
    description: Local development (stockforge-api)

paths:
  # ---------- AUTH ----------
  /api/auth/register:
    post:
      summary: Create a user account
      operationId: registerUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid payload
        '409':
          description: Email already registered

  /api/auth/login:
    post:
      summary: Authenticate and receive a JWT
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Invalidate the current token
      operationId: logout
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out

  # ---------- MARKET DATA ----------
  /api/marketdata/{symbol}:
    get:
      summary: Latest price and depth for a symbol
      operationId: getMarketData
      tags: [market-data]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Symbol'
      responses:
        '200':
          description: Current market snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSnapshot'
        '404':
          description: Unknown symbol

  # ---------- ORDERS ----------
  /api/orders:
    post:
      summary: Place an order (market or limit)
      operationId: createOrder
      tags: [orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '202':
          description: Order accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order
        '401':
          description: Unauthenticated
        '422':
          description: Rejected by risk checks

    get:
      summary: List current user's orders
      operationId: listOrders
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/orders/{id}:
    get:
      summary: Order detail and current status
      operationId: getOrder
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

    delete:
      summary: Cancel an open order
      operationId: cancelOrder
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '409':
          description: Order not cancellable (already filled/cancelled)

  /api/orders/history:
    get:
      summary: Completed order history
      operationId: orderHistory
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historical orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  # ---------- PORTFOLIO ----------
  /api/portfolio:
    get:
      summary: Cash and asset balances
      operationId: getPortfolio
      tags: [portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'

  /api/portfolio/positions:
    get:
      summary: Open positions (holdings)
      operationId: getPositions
      tags: [portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'

  /api/portfolio/pl:
    get:
      summary: Realised and unrealised P&L
      operationId: getPnl
      tags: [portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlSummary'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- AUTH ----------
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            example: USER

    # ---------- MARKET DATA ----------
    Symbol:
      type: string
      description: Uppercase ticker, e.g. AAPL, TSLA

    MarketSnapshot:
      type: object
      required: [symbol, bid, ask, last, volume]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        bid:
          type: number
          format: double
        ask:
          type: number
          format: double
        last:
          type: number
          format: double
          description: Last traded price
        volume:
          type: integer
          format: int64

    # ---------- ORDERS ----------
    NewOrder:
      type: object
      required: [symbol, side, orderType, quantity]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/Side'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: integer
          minimum: 1
        limitPrice:
          type: number
          format: double
          description: Required when orderType = LIMIT
        clientOrderId:
          type: string
          description: Idempotency key - retrying with the same value does not duplicate

    Order:
      type: object
      required: [id, symbol, side, orderType, quantity, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        clientOrderId:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/Side'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: integer
        filledQuantity:
          type: integer
        limitPrice:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Side:
      type: string
      enum: [BUY, SELL]

    OrderType:
      type: string
      enum: [MARKET, LIMIT]

    OrderStatus:
      type: string
      enum: [NEW, ACCEPTED, REJECTED, PARTIALLY_FILLED, FILLED, CANCELLED]

    # ---------- PORTFOLIO ----------
    Portfolio:
      type: object
      required: [cash, assetValue, totalValue]
      properties:
        cash:
          type: number
          format: double
        assetValue:
          type: number
          format: double
        totalValue:
          type: number
          format: double

    Position:
      type: object
      required: [symbol, quantity, averagePrice]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        quantity:
          type: integer
        averagePrice:
          type: number
          format: double

    PnlSummary:
      type: object
      required: [realisedPnl, unrealisedPnl]
      properties:
        realisedPnl:
          type: number
          format: double
        unrealisedPnl:
          type: number
          format: double
